<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="Favicon/groupchats.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | F. Manneh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 210, 255, 0.1), transparent 50%);
            overflow: hidden;
        }

        .login-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 210, 255, 0.1);
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: inline-block;
            background: rgba(0, 210, 255, 0.1);
            padding: 1rem;
            border-radius: 50%;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .login-title {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-family: 'Outfit', sans-serif;
            color: #fff;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .login-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border-radius: 12px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .login-btn {
            width: 100%;
            background: var(--gradient);
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
        }

        #error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-glass">
        <i class='bx bx-lock-alt login-icon'></i>
        <h1 class="login-title">Admin Portal</h1>
        <p class="login-subtitle">Authenticate to view site analytics.</p>

        <form id="loginForm">
            <div class="input-group">
                <i class='bx bx-key'></i>
                <input type="password" id="passcode" class="login-input" placeholder="Enter strictly private passcode..." required>
            </div>
            
            <button type="submit" class="login-btn">Secure Login</button>
            <p id="error-msg">Incorrect passcode. Access rejected.</p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const passcode = document.getElementById('passcode').value;
            
            // NOTE: This is a front-end check for demonstration purposes.
            // Ideally, this should talk to a real backend (like Firebase).
            if(passcode === "francisco2026") {
                // Store a simple auth token in local storage
                localStorage.setItem("admin_auth", "true");
                window.location.href = "dashboard.html";
            } else {
                document.getElementById('error-msg').style.display = "block";
            }
        });
    </script>
</body>
</html>
